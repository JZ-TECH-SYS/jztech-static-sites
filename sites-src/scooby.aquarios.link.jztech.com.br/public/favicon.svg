<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fishGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fb923c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#oceanGrad)"/>
  
  <!-- Water waves -->
  <path d="M 0 60 Q 12.5 55 25 60 T 50 60 T 75 60 T 100 60 L 100 100 L 0 100 Z" fill="#0284c7" opacity="0.3"/>
  <path d="M 0 70 Q 12.5 65 25 70 T 50 70 T 75 70 T 100 70 L 100 100 L 0 100 Z" fill="#0369a1" opacity="0.3"/>
  
  <!-- Fish body -->
  <ellipse cx="50" cy="40" rx="22" ry="15" fill="url(#fishGrad)"/>
  
  <!-- Fish tail -->
  <path d="M 28 40 Q 20 35 18 40 Q 20 45 28 40 Z" fill="url(#fishGrad)"/>
  
  <!-- Fish eye -->
  <circle cx="60" cy="37" r="3.5" fill="white"/>
  <circle cx="61" cy="36.5" r="1.8" fill="#1e293b"/>
  
  <!-- Fish fins -->
  <path d="M 50 50 Q 48 58 52 60 Q 54 55 50 50 Z" fill="#ea580c" opacity="0.8"/>
  <path d="M 50 30 Q 48 24 52 22 Q 54 27 50 30 Z" fill="#ea580c" opacity="0.8"/>
  
  <!-- Fish mouth -->
  <path d="M 70 40 Q 73 40 72 42" stroke="#dc2626" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  
  <!-- Bubbles -->
  <circle cx="70" cy="25" r="2.5" fill="white" opacity="0.6"/>
  <circle cx="78" cy="20" r="2" fill="white" opacity="0.5"/>
  <circle cx="75" cy="30" r="1.8" fill="white" opacity="0.6"/>
  <circle cx="82" cy="28" r="1.5" fill="white" opacity="0.5"/>
</svg>
