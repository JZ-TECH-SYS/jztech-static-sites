# JZ-TECH — sites estaticos (paginas de apresentacao + sites de clientes)
# 1 nginx servindo varios sites por Host, atras do Gateway compartilhado.
map $host $site_root {
    default                              /sites/jztech.com.br;
    jztech.com.br                        /sites/jztech.com.br;
    www.jztech.com.br                    /sites/jztech.com.br;
    joaosn.jztech.com.br                 /sites/joaosn.jztech.com.br;
    leticia.jztech.com.br                /sites/leticia.jztech.com.br;
    prescila.jztech.com.br               /sites/prescila.jztech.com.br;
    street.style.links.jztech.com.br     /sites/street.style.links.jztech.com.br;
    lamove.jztech.com.br                 /sites/lamove.jztech.com.br;
    jean.jztech.com.br                   /sites/jean.jztech.com.br;
    jg-eletricista.jztech.com.br         /sites/jg-eletricista.jztech.com.br;
    scooby.aquarios.link.jztech.com.br   /sites/scooby.aquarios.link.jztech.com.br;
    juninho-mototaxi.jztech.com.br       /sites/juninho-mototaxi.jztech.com.br;
    clientecelularis.jztech.com.br       /sites/clientecelularis.jztech.com.br;
}

server {
    listen 80 default_server;
    server_name _;
    root $site_root;
    index index.html index.htm;
    charset utf-8;
    client_max_body_size 5m;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # health check do Gateway/probe (independe do Host)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # assets com cache
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|css|js|woff2?|ttf|eot|mp4|webm|pdf)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # bloqueia arquivos/pastas ocultos (.git, .github, .ftp-deploy-*, .env, .htaccess)
    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# La Movê: a imagem de prévia do link e os ícones abrem em outro site (WhatsApp, Instagram); o resto, só no próprio
map $uri $lamove_corp {
    ~^/assets/(og|og-bio)\.jpg$  cross-origin;
    ~^/assets/icone-              cross-origin;
    default                      same-origin;
}

# La Movê: server próprio para ter cabeçalhos de segurança e 404 de verdade sem mudar os outros sites
server {
    listen 80;
    server_name lamove.jztech.com.br;
    root /sites/lamove.jztech.com.br;
    index index.html;
    charset utf-8;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_proxied any;   # no GKE o pedido chega pelo balanceador do Google (cabeçalho Via): sem isso o nginx não comprime
    gzip_types text/css application/javascript text/plain application/xml image/svg+xml application/manifest+json application/ld+json;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy $lamove_corp always;
    # o resto da CSP está na <meta> de cada página; frame-ancestors só vale no cabeçalho
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    location ^~ /.well-known/ {
        default_type text/plain;
    }

    location ~ /\. {
        return 404;
    }

    # expires (e não add_header) para os cabeçalhos de cima continuarem valendo aqui
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|css|js|woff2?|ttf|eot|mp4|webm|pdf)$ {
        expires 7d;
    }

    location ~* \.html$ {
        expires -1;
    }

    location ~* \.webmanifest$ {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
