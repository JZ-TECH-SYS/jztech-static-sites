# JZ-TECH — sites estaticos (paginas de apresentacao + sites de clientes)
# 1 nginx servindo varios sites por Host, atras do Gateway compartilhado.
map $host $site_root {
    default                              /sites/jztech.com.br;
    jztech.com.br                        /sites/jztech.com.br;
    www.jztech.com.br                    /sites/jztech.com.br;
    joaosn.jztech.com.br                 /sites/joaosn.jztech.com.br;
    leticia.jztech.com.br                /sites/leticia.jztech.com.br;
    prescila.jztech.com.br               /sites/prescila.jztech.com.br;
    street.style.links.jztech.com.br     /sites/street.style.links.jztech.com.br;
    jean.jztech.com.br                   /sites/jean.jztech.com.br;
    jg-eletricista.jztech.com.br         /sites/jg-eletricista.jztech.com.br;
    scooby.aquarios.link.jztech.com.br   /sites/scooby.aquarios.link.jztech.com.br;
    juninho-mototaxi.jztech.com.br       /sites/juninho-mototaxi.jztech.com.br;
    clientecelularis.jztech.com.br       /sites/clientecelularis.jztech.com.br;
}

server {
    listen 80 default_server;
    server_name _;
    root $site_root;
    index index.html index.htm;
    charset utf-8;
    client_max_body_size 5m;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # health check do Gateway/probe (independe do Host)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # assets com cache
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif|css|js|woff2?|ttf|eot|mp4|webm|pdf)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # bloqueia arquivos/pastas ocultos (.git, .github, .ftp-deploy-*, .env, .htaccess)
    location ~ /\. {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
